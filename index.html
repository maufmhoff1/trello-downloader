<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Trello Bilder Downloader</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 40px auto; padding: 20px; background: #f4f5f7; }
    .box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-top: 12px; }
    textarea { width: 100%; padding: 10px; margin: 5px 0 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
    button { width: 100%; padding: 12px; margin-top: 8px; background: #5aac44; color: white; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; }
    button:hover { background: #49852e; }
    #status { margin-top: 15px; font-weight: bold; color: #333; line-height: 1.4; }
    .hint { background: #e4f0f6; padding: 12px; border-radius: 4px; font-size: 13px; color: #172b4d; line-height: 1.6; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Trello Bilder herunterladen</h2>

    <div class="hint">
      <b>So lädst du alle Bilder in 3 Schritten:</b><br>
      1. Öffne deine Trello-Karte im Browser.<br>
      2. Klicke oben in die Adressleiste, tippe <b>.json</b> ganz ans Ende des Links und drücke <b>Enter</b>.<br>
      3. Drücke auf der Text-Seite <b>Strg + A</b>, dann <b>Strg + C</b> und füge alles hier unten ein:
    </div>

    <label>Kopierten Text aus Trello hier einfügen:</label>
    <textarea id="jsonInput" rows="5" placeholder='Hier mit Strg + V einfügen...'></textarea>
    <button onclick="startDownloads()">Alle Bilder jetzt herunterladen</button>

    <div id="status"></div>
  </div>

  <script>
    async function startDownloads() {
      var status = document.getElementById('status');
      var rawText = document.getElementById('jsonInput').value.trim();

      if (!rawText) {
        status.style.color = "red";
        status.innerText = "Bitte zuerst den kopierten Text aus Trello einfügen!";
        return;
      }

      try {
        var data = JSON.parse(rawText);
        var attachments = data.attachments || [];
        var images = attachments.filter(function(a) {
          return /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(a.name) || (a.mimeType && a.mimeType.indexOf('image/') === 0);
        });

        if (images.length === 0) {
          status.style.color = "orange";
          status.innerText = "Keine Bilder in dieser Karte gefunden.";
          return;
        }

        for (var i = 0; i < images.length; i++) {
          status.style.color = "#0079bf";
          status.innerText = "Lade Bild " + (i + 1) + " von " + images.length + "...";
          var img = images.at(i);
          
          var link = document.createElement("a");
          link.href = img.url;
          link.download = img.name;
          link.target = "_blank";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          await new Promise(function(r) { setTimeout(r, 700); });
        }

        status.style.color = "green";
        status.innerText = "Fertig! " + images.length + " Bilder wurden heruntergeladen.";
      } catch (e) {
        status.style.color = "red";
        status.innerText = "Ungültiger Text. Bitte auf der .json-Seite wirklich alles mit Strg + A markieren und kopieren.";
      }
    }
  </script>
</body>
</html>
