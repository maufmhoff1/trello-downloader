<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Trello Bilder Downloader</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 40px auto; padding: 20px; background: #f4f5f7; }
    .box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-top: 14px; }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px; margin: 6px 0 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
    button { width: 100%; padding: 12px; margin-top: 10px; background: #5aac44; color: white; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; }
    button:hover { background: #49852e; }
    #status { margin-top: 15px; font-weight: bold; color: #333; line-height: 1.4; }
    .hint { background: #e4f0f6; padding: 12px; border-radius: 4px; font-size: 13px; color: #172b4d; line-height: 1.5; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Trello Bilder herunterladen</h2>

    <div class="hint">
      <b>1x Board-Datei holen:</b> Trello-Board &rarr; <b>&hellip; (Menü)</b> &rarr; <b>Drucken und exportieren</b> &rarr; <b>Als JSON exportieren</b>.
    </div>

    <label>1. Exportierte Board-JSON-Datei auswählen:</label>
    <input type="file" id="jsonFile" accept=".json" />

    <label>2. Link der Trello-Karte einfügen:</label>
    <input type="text" id="cardUrl" placeholder="https://trello.com..." />

    <button onclick="startZipDownload()">Bilder-Ordner (ZIP) herunterladen</button>

    <div id="status"></div>
  </div>

  <script>
        class MiniZip {
      constructor() { this.files = []; this.folderName = ""; }
      folder(name) { this.folderName = name + "/"; return this; }
      file(name, blob) { this.files.push({ name: this.folderName + name, blob }); }
      async generateAsync() {
        const enc = new TextEncoder(), parts = [], central = [];
        let offset = 0;
        for (const f of this.files) {
          const data = new Uint8Array(await f.blob.arrayBuffer());
          const nameBytes = enc.encode(f.name);
          const header = new Uint8Array(30 + nameBytes.length);
          const v = new DataView(header.buffer);
          v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true);
          v.setUint32(18, data.length, true); v.setUint32(22, data.length, true);
          v.setUint16(26, nameBytes.length, true);
          header.set(nameBytes, 30);
          parts.push(header, data);
          const cd = new Uint8Array(46 + nameBytes.length);
          const cv = new DataView(cd.buffer);
          cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
          cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
          cv.setUint16(28, nameBytes.length, true); cv.setUint32(42, offset, true);
          cd.set(nameBytes, 46);
          central.push(cd);
          offset += header.length + data.length;
        }
        const cdSize = central.reduce((s, a) => s + a.length, 0);
        const eocd = new Uint8Array(22);
        const ev = new DataView(eocd.buffer);
        ev.setUint32(0, 0x06054b50, true);
        ev.setUint16(8, this.files.length, true); ev.setUint16(10, this.files.length, true);
        ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
        return new Blob([...parts, ...central, eocd], { type: "application/zip" });
      }
    }

    function loadImageAsBlob(url) {
      return new Promise(function(resolve, reject) {
        var img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = function() {
          var canvas = document.createElement("canvas");
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0);
          canvas.toBlob(function(blob) {
            if (blob) resolve(blob);
            else reject(new Error("Canvas leer"));
          }, "image/jpeg", 0.95);
        };
        img.onerror = function() {
          reject(new Error("Bild konnte nicht geladen werden"));
        };
        img.src = url;
      });
    }

    async function startZipDownload() {
      var status = document.getElementById('status');
      var fileInput = document.getElementById('jsonFile');
      var urlInput = document.getElementById('cardUrl').value.trim();
      var match = urlInput.match(/\/c\/([a-zA-Z0-9]+)/);

      if (!fileInput.files || fileInput.files.length === 0) {
        status.style.color = "red";
        status.innerText = "Bitte wähle zuerst deine JSON-Datei aus!";
        return;
      }

      if (!match) {
        status.style.color = "red";
        status.innerText = "Bitte füge den Link deiner Trello-Karte ein!";
        return;
      }

      var shortLink = match.at(1);
      var reader = new FileReader();

      reader.onload = async function(e) {
        try {
          var boardData = JSON.parse(e.target.result);
          var cards = boardData.cards || [];
          var targetCard = cards.find(function(c) {
            return c.shortLink === shortLink || (c.url && c.url.indexOf('/c/' + shortLink) !== -1);
          });

          if (!targetCard) {
            status.style.color = "red";
            status.innerText = "Karte wurde in dieser JSON-Datei nicht gefunden.";
            return;
          }

          var attachments = targetCard.attachments || [];
          var images = attachments.filter(function(a) {
            return /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(a.name) || (a.mimeType && a.mimeType.indexOf('image/') === 0);
          });

          if (images.length === 0) {
            status.style.color = "orange";
            status.innerText = "Keine Bilder in dieser Karte gefunden.";
            return;
          }

          var folderName = (targetCard.name || "Trello_Bilder").replace(/[\\/*?:"<>|]/g, '_').substring(0, 50);
          var zip = new MiniZip();
          var folder = zip.folder(folderName);
          var geladen = 0;

          for (var i = 0; i < images.length; i++) {
            status.style.color = "#0079bf";
            status.innerText = "Packe Bild " + (i + 1) + " von " + images.length + " in Ordner...";
            var img = images.at(i);
            var cleanName = String(i + 1).padStart(2, '0') + "_" + img.name.replace(/[\\/*?:"<>|]/g, '_');

            try {
              var blob = await loadImageAsBlob(img.url);
              folder.file(cleanName, blob);
              geladen++;
            } catch (err) {
              console.warn("Übersprungen:", img.name);
            }
          }

          if (geladen === 0) {
            status.style.color = "red";
            status.innerText = "Trello schützt diese privaten Bilder gegen Browser-Zugriff. Nutze dafür die kleine Windows .bat-Datei.";
            return;
          }

          status.innerText = "Erstelle ZIP-Ordner...";
          var zipBlob = await zip.generateAsync({ type: "blob" });
          var link = document.createElement("a");
          link.href = URL.createObjectURL(zipBlob);
          link.download = folderName + ".zip";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          status.style.color = "green";
          status.innerText = "Fertig! '" + folderName + ".zip' (mit " + geladen + " Bildern im Ordner) liegt in deinen Downloads.";
        } catch (err) {
          status.style.color = "red";
          status.innerText = "Fehler: " + err.message;
        }
      };

      reader.readAsText(fileInput.files.item(0));
    }
  </script>
</body>
</html>
