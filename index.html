<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Trello Bilder Downloader</title>
  <script src="https://cloudflare.com"></script>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; background: #f4f5f7; }
    .box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-top: 10px; }
    input { width: 100%; padding: 10px; margin: 5px 0 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 12px; margin-top: 10px; background: #0079bf; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #026aa7; }
    #status { margin-top: 15px; font-weight: bold; color: #333; }
    details { margin-bottom: 15px; background: #f9fafc; padding: 10px; border-radius: 4px; border: 1px solid #e1e4e8; }
    summary { cursor: pointer; font-weight: bold; font-size: 13px; color: #0079bf; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Trello Bilder herunterladen</h2>

    <details id="authBox" open>
      <summary>Zugangsdaten (werden nur in deinem Browser gespeichert)</summary>
      <label>Trello API-Key:</label>
      <input type="password" id="apiKey" placeholder="Deinen API-Key einfügen" onchange="saveKeys()" />
      <label>Trello Token:</label>
      <input type="password" id="apiToken" placeholder="Deinen Token einfügen" onchange="saveKeys()" />
    </details>

    <label>Link zur Trello-Karte hier einfügen:</label>
    <input type="text" id="cardUrl" placeholder="https://trello.com..." />
    <button onclick="downloadImages()">Alle Bilder als ZIP laden</button>
    <div id="status"></div>
  </div>

  <script>
    // Gespeicherte Schlüssel beim Öffnen der Seite automatisch laden
    window.onload = function() {
      const savedKey = localStorage.getItem('trello_api_key');
      const savedTok = localStorage.getItem('trello_api_token');
      if (savedKey) document.getElementById('apiKey').value = savedKey;
      if (savedTok) document.getElementById('apiToken').value = savedTok;
      if (savedKey && savedTok) {
        document.getElementById('authBox').removeAttribute('open');
      }
    };

    function saveKeys() {
      localStorage.setItem('trello_api_key', document.getElementById('apiKey').value.trim());
      localStorage.setItem('trello_api_token', document.getElementById('apiToken').value.trim());
    }

    async function downloadImages() {
      saveKeys();
      const API_KEY = document.getElementById('apiKey').value.trim();
      const TOKEN = document.getElementById('apiToken').value.trim();
      const status = document.getElementById('status');
      const urlInput = document.getElementById('cardUrl').value.trim();
      const match = urlInput.match(/\/c\/([a-zA-Z0-9]+)/);

      if (!API_KEY || !TOKEN) {
        status.style.color = "red";
        status.innerText = "Bitte oben zuerst deinen API-Key und Token eintragen!";
        document.getElementById('authBox').setAttribute('open', '');
        return;
      }

      if (!match) {
        status.style.color = "red";
        status.innerText = "Bitte einen gültigen Trello-Karten-Link einfügen!";
        return;
      }

      const cardId = match[1];
      status.style.color = "#0079bf";
      status.innerText = "Suche Bilder auf der Karte...";

      try {
        const res = await fetch(`https://trello.com{cardId}/attachments?key=${API_KEY}&token=${TOKEN}`);
        if (!res.ok) throw new Error("Trello-Zugriff fehlgeschlagen (Status " + res.status + "). Key/Token prüfen!");
        
        const attachments = await res.json();
        const images = attachments.filter(a => /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(a.name) || (a.mimeType && a.mimeType.startsWith('image/')));

        if (images.length === 0) {
          status.style.color = "orange";
          status.innerText = "Keine Bilder in dieser Karte gefunden.";
          return;
        }

        const zip = new JSZip();
        for (let i = 0; i < images.length; i++) {
          status.innerText = `Lade Bild ${i + 1} von ${images.length}...`;
          const img = images[i];
          const dlUrl = `https://trello.com{cardId}/attachments/${img.id}/download/${encodeURIComponent(img.name)}?key=${API_KEY}&token=${TOKEN}`;
          const imgRes = await fetch(dlUrl);
          if (!imgRes.ok) throw new Error("Download von Bild " + (i + 1) + " blockiert.");
          const blob = await imgRes.blob();
          const cleanName = `${String(i + 1).padStart(2, '0')}_${img.name.replace(/[\\/*?:"<>|]/g, '_')}`;
          zip.file(cleanName, blob);
        }

        status.innerText = "Erstelle ZIP-Datei...";
        const zipBlob = await zip.generateAsync({ type: "blob" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(zipBlob);
        link.download = `Trello_Karte_${cardId}_Bilder.zip`;
        link.click();

        status.style.color = "green";
        status.innerText = `Fertig! ${images.length} Bilder wurden als ZIP heruntergeladen.`;
      } catch (err) {
        status.style.color = "red";
        status.innerText = "Fehler: " + err.message;
      }
    }
  </script>
</body>
</html>
